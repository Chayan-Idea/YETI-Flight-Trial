name: YETI Quality System V2 — Isolated Browser Gates

on:
  push:
    branches: [feat/dynamic-pdf-checklist-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeti-quality-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    name: "${{ matrix.suite.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: "PDF Engine"
            script: tests/pdf-template-browser.e2e.cjs
            artifacts: "/tmp/yeti-pdf-*"
          - name: "Flight Preparation"
            script: tests/flight-preparation.e2e.cjs
            artifacts: "/tmp/yeti-flight-preparation-*"
          - name: "Propulsion Analyzer"
            script: tests/propulsion-analyser.e2e.cjs
            artifacts: "/tmp/yeti-browser-*"
          - name: "Application Smoke"
            script: tests/browser-smoke.cjs
            artifacts: "/tmp/yeti-smoke-*"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run suite three consecutive times
        shell: bash
        env:
          YETI_TEST_ATTEMPT: "1"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::${{ matrix.suite.name }} — attempt ${attempt}/3"
            YETI_TEST_ATTEMPT="$attempt" node "${{ matrix.suite.script }}"
            echo "::endgroup::"
          done
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yeti-${{ matrix.suite.name }}-diagnostics-${{ github.run_id }}
          path: |
            ${{ matrix.suite.artifacts }}
            /tmp/yeti-browser-trace.zip
            /tmp/yeti-browser-failure.png
          if-no-files-found: warn
          retention-days: 7
