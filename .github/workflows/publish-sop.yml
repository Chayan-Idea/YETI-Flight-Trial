name: Publish Flight Trial SOP PDF
on:
  push:
    branches: [main]
    paths:
      - 'pending-sop/flight-trial-sop.json'
permissions:
  contents: write
concurrency:
  group: yeti-sop-pdf-publication
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout submitted PDF
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark upload detected
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const status={schemaVersion:1,revision:'pending',state:'validating',message:'GitHub detected the SOP JSON package. Validating package metadata, PDF signature, checksum and document structure.',updatedAt:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID};
          fs.writeFileSync('data/sop-publication-status.json',JSON.stringify(status,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sop-publication-status.json
          git commit -m "status: SOP PDF upload detected"
          git push origin HEAD:main
      - name: Install PDF validation utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
      - name: Validate PDF and publish immutable revision
        shell: bash
        run: |
          set -euo pipefail
          qpdf --check pending-sop/flight-trial-sop.pdf
          pdfinfo pending-sop/flight-trial-sop.pdf > /tmp/sop-pdfinfo.txt
          PAGES="$(awk '/^Pages:/ {print $2}' /tmp/sop-pdfinfo.txt)"
          test "${PAGES:-0}" -gt 0
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const packagePath='pending-sop/flight-trial-sop.json';
          if(!fs.existsSync(packagePath))throw new Error('Expected pending-sop/flight-trial-sop.json.');
          const pkg=JSON.parse(fs.readFileSync(packagePath,'utf8'));
          if(pkg.schemaVersion!==1||pkg.packageType!=='yeti-flight-trial-sop-pdf'||pkg.fileName!=='flight-trial-sop.pdf'||pkg.mimeType!=='application/pdf'||typeof pkg.pdfBase64!=='string')throw new Error('Invalid SOP JSON package schema.');
          const b=Buffer.from(pkg.pdfBase64,'base64');
          if(b.length!==Number(pkg.sizeBytes))throw new Error('Decoded PDF size does not match JSON metadata.');
          if(crypto.createHash('sha256').update(b).digest('hex')!==pkg.sha256)throw new Error('PDF SHA-256 checksum does not match JSON metadata.');
          const src='pending-sop/flight-trial-sop.pdf';
          fs.writeFileSync(src,b);
          if(b.length<100||b.length>18*1024*1024)throw new Error('PDF must be between 100 bytes and 18 MB for JSON upload compatibility.');
          if(b.subarray(0,5).toString('ascii')!=='%PDF-')throw new Error('Uploaded file does not have a valid PDF signature.');
          if(!b.includes(Buffer.from('%%EOF')))throw new Error('PDF end-of-file marker is missing; upload may be incomplete.');
          const now=new Date(),stamp=now.toISOString().slice(0,19).replace(/[-:T]/g,'').replace(/^(\d{8})(\d{6})$/,'$1-$2');
          const revision=stamp+'-'+process.env.GITHUB_RUN_ID;
          const rel='documents/sop/revisions/'+revision+'.pdf';
          fs.mkdirSync(path.dirname(rel),{recursive:true});fs.copyFileSync(src,rel);
          const info=fs.readFileSync('/tmp/sop-pdfinfo.txt','utf8');const pageMatch=info.match(/^Pages:\s+(\d+)/m);if(!pageMatch)throw new Error('Could not determine PDF page count.');const manifest={schemaVersion:2,revision,updatedAt:now.toISOString(),updatedBy:'Admin upload',fileName:'flight-trial-sop.pdf',mimeType:'application/pdf',sizeBytes:b.length,pageCount:Number(pageMatch[1]),sha256:crypto.createHash('sha256').update(b).digest('hex'),pdfUrl:rel};
          fs.writeFileSync('data/flight-trial-sop.json',JSON.stringify(manifest,null,2)+'\n');
          fs.writeFileSync('data/sop-publication-status.json',JSON.stringify({schemaVersion:1,revision,state:'publishing',message:'PDF validation passed. Publishing the immutable revision and updating the shared manifest.',updatedAt:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID},null,2)+'\n');
          fs.rmSync(src);fs.rmSync('pending-sop/flight-trial-sop.json');
          NODE
          git add documents/sop/revisions data/flight-trial-sop.json data/sop-publication-status.json pending-sop/
          git commit -m "publish: Flight Trial SOP PDF revision"
          git push origin HEAD:main
      - name: Mark publication complete
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),m=JSON.parse(fs.readFileSync('data/flight-trial-sop.json','utf8'));
          fs.writeFileSync('data/sop-publication-status.json',JSON.stringify({schemaVersion:1,revision:m.revision,state:'published',message:'The new SOP PDF is published and available to all YETI users.',updatedAt:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID},null,2)+'\n');
          NODE
          git add data/sop-publication-status.json
          git commit -m "status: SOP PDF revision published"
          git push origin HEAD:main
      - name: Mark publication failed
        if: failure()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          let revision='pending';
          try{const m=JSON.parse(fs.readFileSync('data/flight-trial-sop.json','utf8'));revision=String(m.revision||revision);}catch(_){}
          fs.writeFileSync('data/sop-publication-status.json',JSON.stringify({schemaVersion:1,revision,state:'failed',message:'GitHub Actions could not validate or publish the PDF. The previous published SOP remains active. Review the workflow run for details.',updatedAt:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID},null,2)+'\n');
          NODE
          git add data/sop-publication-status.json
          git commit -m "status: SOP PDF publication failed" || true
          git push origin HEAD:main || true
