name: YETI Full Assurance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

concurrency:
  group: yeti-full-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-validation:
    timeout-minutes: 10
    name: Layer 1 — Static and structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-app.mjs

  engine-unit-tests:
    timeout-minutes: 10
    name: Layer 2 — Propulsion calculation unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/propulsion-analysis-engine.test.js
      - run: node tests/yeti-modules.test.js

  browser-smoke:
    name: Layer 3A — Browser, Flight Preparation and UI preservation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .baseline-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            node_modules
          key: yeti-full-v1-${{ runner.os }}-node22-playwright1.65.1
          restore-keys: yeti-full-v1-${{ runner.os }}-node22-playwright1.65.1-
      - name: Install pinned browser test dependencies
        run: |
          if [ ! -x node_modules/.bin/playwright ]; then
            npm install --no-save --no-package-lock playwright@1.65.1 pixelmatch@5.3.0 pngjs@6.0.0
          fi
      - name: Install Chromium when cache is cold
        run: |
          if ! find "$HOME/.cache/ms-playwright" -maxdepth 1 -type d -name 'chromium-*' 2>/dev/null | grep -q .; then
            ./node_modules/.bin/playwright install chromium
          fi
      - run: node tests/browser-smoke.cjs
      - run: node tests/flight-preparation.e2e.cjs
      - name: Compare Flight Preparation UI with untouched main baseline
        env:
          YETI_BASELINE_ROOT: ${{ github.workspace }}/.baseline-main
        run: node tests/ui-preservation.e2e.cjs
      - name: Upload Flight Preparation and visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeti-flight-preparation-ui-evidence
          path: |
            /tmp/yeti-flight-preparation-failure.png
            /tmp/yeti-flight-preparation-trace.zip
            /tmp/yeti-ui-preservation
          if-no-files-found: ignore
          retention-days: 7

  application-assurance:
    name: Phase 4 — Cross-browser, offline, accessibility and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            node_modules
          key: yeti-full-v1-${{ runner.os }}-node22-playwright1.65.1
          restore-keys: yeti-full-v1-${{ runner.os }}-node22-playwright1.65.1-
      - name: Install pinned assurance dependencies
        run: |
          if [ ! -x node_modules/.bin/playwright ] || [ ! -d node_modules/axe-core ]; then
            npm install --no-save --no-package-lock playwright@1.65.1 axe-core@4.11.0
          fi
      - name: Install Linux dependencies required by all browsers
        run: ./node_modules/.bin/playwright install-deps chromium firefox webkit
      - name: Install Chromium, Firefox and WebKit when cache is cold
        run: |
          for browser in chromium firefox webkit; do
            if ! find "$HOME/.cache/ms-playwright" -maxdepth 1 -type d -name "$browser-*" 2>/dev/null | grep -q .; then
              ./node_modules/.bin/playwright install "$browser"
            fi
          done
      - run: node tests/application-assurance.e2e.cjs
      - name: Upload application assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeti-application-assurance-evidence
          path: /tmp/yeti-assurance-*.png
          if-no-files-found: ignore
          retention-days: 7

  browser-workflow:
    name: Layer 3B and 4 — Analyzer workflow and end-to-end regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            node_modules
          key: yeti-full-v1-${{ runner.os }}-node22-playwright1.65.1
          restore-keys: yeti-full-v1-${{ runner.os }}-node22-playwright1.65.1-
      - name: Install Playwright when missing
        run: |
          if [ ! -x node_modules/.bin/playwright ]; then
            npm install --no-save --no-package-lock playwright@1.65.1 pixelmatch@5.3.0 pngjs@6.0.0
          else
            npm install --no-save --no-package-lock pixelmatch@5.3.0 pngjs@6.0.0
          fi
      - name: Install Chromium when cache is cold
        run: |
          if ! find "$HOME/.cache/ms-playwright" -maxdepth 1 -type d -name 'chromium-*' 2>/dev/null | grep -q .; then
            ./node_modules/.bin/playwright install chromium
          fi
      - run: node tests/propulsion-analyser.e2e.cjs
      - name: Upload analyzer regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeti-browser-regression-diagnostics
          path: |
            /tmp/yeti-browser-failure.png
            /tmp/yeti-browser-trace.zip
          if-no-files-found: ignore
          retention-days: 7

  phase5-certification:
    name: Phase 5 — Final release certification
    needs:
      - static-validation
      - engine-unit-tests
      - browser-smoke
      - application-assurance
      - browser-workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate final quality certification
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/phase5-release-certification.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: yeti-phase5-certification
          path: quality-evidence/
          if-no-files-found: error
          retention-days: 30
