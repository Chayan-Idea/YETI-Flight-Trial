name: YETI SOP Three-Stage Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/flight-trial-sop-editor.js'\n      - 'css/flight-trial-sop-reader.css'
      - 'js/yeti-auth.js'
      - 'data/flight-trial-sop.json'
      - 'data/sop-publication-status.json'
      - 'service-worker.js'
      - 'documents/sop/**'
      - 'pending-sop/**'
      - '.github/workflows/quality-checks.yml'
      - '.github/workflows/publish-sop.yml'
      - 'tests/flight-trial-sop.test.cjs'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/flight-trial-sop-editor.js'
      - 'js/yeti-auth.js'
      - 'data/flight-trial-sop.json'
      - 'data/sop-publication-status.json'
      - 'service-worker.js'
      - 'documents/sop/**'
      - 'pending-sop/**'
      - '.github/workflows/quality-checks.yml'
      - '.github/workflows/publish-sop.yml'
      - 'tests/flight-trial-sop.test.cjs'

permissions:
  contents: read

concurrency:
  group: yeti-sop-three-stage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage-1:
    name: 'Stage 1 — Implementation & Integration'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate changed SOP application scripts
        run: |
          set -euo pipefail
          node --check js/flight-trial-sop-editor.js
          node --check js/yeti-auth.js
          node --check service-worker.js
          node --check tests/flight-trial-sop.test.cjs
      - name: Confirm required SOP interface and publication assets are present
        run: |
          set -euo pipefail
          test -f data/flight-trial-sop.json
          test -f data/sop-publication-status.json
          grep -q 'id="flightTrialSopPdfInput"' index.html
          grep -q 'id="flightTrialSopProceedBtn"' index.html
          grep -q 'flight-trial-sop-editor.js?v=21' index.html
          echo "Stage 1 PASS — implementation syntax and integration points are valid."

  stage-2:
    name: 'Stage 2 — Quick Quality Check'
    needs: stage-1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused SOP PDF workflow checks only
        run: node tests/flight-trial-sop.test.cjs
      - name: Record focused validation result
        run: |
          echo "## Stage 2 — Quick Quality Check" >> "$GITHUB_STEP_SUMMARY"
          echo "PASS — SOP PDF upload, Admin/User visibility, PDF validation, immutable revision, status polling and shared-reader checks." >> "$GITHUB_STEP_SUMMARY"

  stage-3-deploy:
    name: 'Stage 3 — Deploy & Live Verification'
    needs: stage-2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build production GitHub Pages package
        run: node scripts/build-site.mjs _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy production webpage
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify deployed webpage and SOP upload controls
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$SITE_URL" -o /tmp/yeti-live-index.html
          grep -q 'flightTrialSopPdfInput' /tmp/yeti-live-index.html
          grep -q 'flight-trial-sop-editor.js?v=20' /tmp/yeti-live-index.html
          echo "Stage 3 PASS — GitHub Pages deployment is live and the SOP PDF upload interface is present."
          echo "- Live URL: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"

# SOP JSON upload validation workflow revision.

# Re-run SOP three-stage validation after JSON upload test alignment.

# Refresh focused SOP checks after cache assertion correction.
