name: YETI Six-Layer Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeti-six-layer-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  six-layer-quality:
    name: Six layers — one quality check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the unchanged production UI baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: .baseline-main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore pinned test dependencies and browser binaries
        id: quality-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            node_modules
          key: yeti-six-layer-v1-${{ runner.os }}-node22-pw1.65.1-pixelmatch5.3.0-png6.0.0-axe4.11.0
          restore-keys: |
            yeti-full-v1-${{ runner.os }}-node22-playwright1.65.1-
            yeti-quick-v1-${{ runner.os }}-node22-playwright1.65.1-

      - name: Install pinned test dependencies
        run: |
          if [ ! -x node_modules/.bin/playwright ] || [ ! -d node_modules/pixelmatch ] || [ ! -d node_modules/pngjs ] || [ ! -d node_modules/axe-core ]; then
            npm install --no-save --no-package-lock playwright@1.65.1 pixelmatch@5.3.0 pngjs@6.0.0 axe-core@4.11.0
          fi

      - name: Install browser engines on a cold cache
        if: steps.quality-cache.outputs.cache-hit != 'true'
        run: |
          for browser in chromium firefox webkit; do
            if ! find "$HOME/.cache/ms-playwright" -maxdepth 1 -type d -name "$browser-*" 2>/dev/null | grep -q .; then
              npx playwright install "$browser"
            fi
          done

      - name: Run all six quality layers with a strict execution budget
        env:
          YETI_BASELINE_ROOT: ${{ github.workspace }}/.baseline-main
        run: node scripts/run-six-layer-quality.mjs
