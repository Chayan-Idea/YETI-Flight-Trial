name: YETI 2-Minute Quick Quality Check

on:
  push:
    branches: [main, feat/dynamic-pdf-checklist-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pdf_path:
        description: PDF path inside template-inbox/ to publish (leave blank for quality check only)
        required: false
        type: string
        default: ''
      review_package_path:
        description: Human-reviewed candidate package JSON inside template-inbox/ (required for PDF publication)
        required: false
        type: string
        default: ''
      approve_activation:
        description: Explicitly approve this reviewed checklist for production activation
        required: false
        type: boolean
        default: false
      approved_by:
        description: Name or GitHub handle of the reviewer approving the checklist
        required: false
        type: string
        default: ''
      approval_reference:
        description: Review/approval record, such as a PR URL or internal document reference
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: yeti-quick-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-quality-check:
    name: Quick Quality Check — single job
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for deterministic PDF intake tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser and optional OCR dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input pymupdf
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.pdf_path }}" ]]; then
            python -m pip install --disable-pip-version-check --no-input pytesseract Pillow
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
      - name: Publish explicitly approved PDF template (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.pdf_path != ''
        env:
          PDF_PATH: ${{ inputs.pdf_path }}
          REVIEW_PACKAGE_PATH: ${{ inputs.review_package_path }}
          APPROVE_ACTIVATION: ${{ inputs.approve_activation }}
          APPROVED_BY: ${{ inputs.approved_by }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          if [[ "$APPROVE_ACTIVATION" != "true" ]]; then
            echo "Publication blocked: explicit approval is required." >&2
            exit 1
          fi
          if [[ -z "$REVIEW_PACKAGE_PATH" ]]; then echo "Publication blocked: a separately reviewed package path is required." >&2; exit 1; fi
          python scripts/publish-approved-pdf.py --pdf "$PDF_PATH" --review-package "$REVIEW_PACKAGE_PATH" --approved-by "$APPROVED_BY" --approval-reference "$APPROVAL_REFERENCE"
      - name: Reject review package without a PDF path
        if: github.event_name == 'workflow_dispatch' && inputs.pdf_path == '' && inputs.review_package_path != ''
        run: |
          echo "A reviewed package cannot be published without its source PDF." >&2
          exit 1
      - name: Reject approval without a PDF path
        if: github.event_name == 'workflow_dispatch' && inputs.pdf_path == '' && inputs.approve_activation == true
        run: |
          echo "Approval was selected but no PDF path was supplied." >&2
          exit 1
      - name: Run the single consolidated quality gate
        shell: bash
        run: |
          set -euo pipefail
          echo "## YETI 2-Minute Quick Quality Check" >> "$GITHUB_STEP_SUMMARY"
          echo "One job; deterministic, dependency-light checks; no separate browser-verification workflow." >> "$GITHUB_STEP_SUMMARY"
          run_check() {
            label="$1"
            shift
            started=$(date +%s)
            echo "::group::$label"
            "$@"
            elapsed=$(( $(date +%s) - started ))
            echo "PASS — $label (${elapsed}s)"
            echo "- PASS — $label (${elapsed}s)" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          }
          run_check "Application structure, assets and JavaScript syntax" node scripts/validate-app.mjs
          run_check "Login roles, tab sessions and inactivity timeout" node tests/yeti-auth.test.js
          run_check "Propulsion calculation unit tests" node tests/propulsion-analysis-engine.test.js
          run_check "Workbook import tests" node tests/yeti-workbook-import.test.js
          run_check "Percentage comparative analysis unit tests" node tests/propulsion-percent-comparison.test.js
          run_check "Analyzer module regression tests" node tests/yeti-modules.test.js
          run_check "PDF template schema and coordinate tests" node tests/pdf-template-engine.test.cjs
          run_check "Active PDF package, mapped cells and SHA-256" node tests/validate-active-pdf-package.cjs
          run_check "PDF intake extractor syntax" python -m py_compile scripts/analyze-pdf-template.py scripts/build-pdf-review-package.py scripts/publish-approved-pdf.py tests/pdf-intake.test.py tests/pdf-template-review-gate.test.py
          run_check "PDF intake extraction and fail-closed tests" python tests/pdf-intake.test.py
          run_check "PDF human-review and exact-cell release gate" python tests/pdf-template-review-gate.test.py
          echo "OVERALL: PASS — application integrity, propulsion calculations, module regression, dynamic PDF intake, package generation and PDF signature-mode integrity all passed." >> "$GITHUB_STEP_SUMMARY"
          echo "YETI QUICK QUALITY CHECK PASSED."
      - name: Commit approved PDF version and active pointer
        if: github.event_name == 'workflow_dispatch' && inputs.pdf_path != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/templates js/daily-airworthiness-pdf-manifest.js service-worker.js
          git diff --cached --quiet && { echo "No publishable PDF changes detected."; exit 1; }
          git commit -m "deploy: activate approved Daily Airworthiness PDF template"
          git push origin HEAD:main

  deploy-production:
    name: Deploy to GitHub Pages
    needs: quick-quality-check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pdf_path != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the quality-checked commit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package YETI application
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
