name: YETI SOP Three-Stage Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/flight-trial-sop-editor.js'
      - 'css/flight-trial-sop-reader.css'
      - 'js/yeti-auth.js'
      - 'data/flight-trial-sop.json'
      - 'data/sop-publication-status.json'
      - 'service-worker.js'
      - 'documents/sop/**'
      - 'pending-sop/**'
      - '.github/workflows/quality-checks.yml'
      - '.github/workflows/publish-sop.yml'
      - 'tests/flight-trial-sop.test.cjs'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/flight-trial-sop-editor.js'
      - 'css/flight-trial-sop-reader.css'
      - 'js/yeti-auth.js'
      - 'data/flight-trial-sop.json'
      - 'data/sop-publication-status.json'
      - 'service-worker.js'
      - 'documents/sop/**'
      - 'pending-sop/**'
      - '.github/workflows/quality-checks.yml'
      - '.github/workflows/publish-sop.yml'
      - 'tests/flight-trial-sop.test.cjs'

permissions:
  contents: read

concurrency:
  group: yeti-sop-three-stage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage-1:
    name: 'Stage 1 — Implementation & Integration'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate changed SOP application scripts
        run: |
          set -euo pipefail
          node --check js/flight-trial-sop-editor.js
          node --check js/page-zoom-lock.js
          node --check js/yeti-auth.js
          node --check service-worker.js
          node --check tests/flight-trial-sop.test.cjs
      - name: Confirm required SOP interface and publication assets are present
        run: |
          set -euo pipefail
          test -f data/flight-trial-sop.json
          test -f data/sop-publication-status.json
          grep -q 'id="flightTrialSopPdfInput"' index.html
          grep -q 'id="flightTrialSopProceedBtn"' index.html
          grep -q 'flight-trial-sop-editor.js?v=22' index.html
          echo "Stage 1 PASS — implementation syntax and integration points are valid."

  stage-2:
    name: 'Stage 2 — Quick Quality Check'
    needs: stage-1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused SOP PDF workflow checks only
        run: node tests/flight-trial-sop.test.cjs
      - name: Record focused validation result
        run: |
          echo "## Stage 2 — Quick Quality Check" >> "$GITHUB_STEP_SUMMARY"
          echo "PASS — SOP PDF upload, Admin/User visibility, PDF validation, immutable revision, status polling and shared-reader checks." >> "$GITHUB_STEP_SUMMARY"

  stage-3-deploy:
    name: 'Stage 3 — Deploy & Live Verification'
    needs: stage-2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for the standard GitHub Pages deployment and verify the live PDF.js reader
        env:
          SITE_URL: https://chayan-idea.github.io/YETI-Flight-Trial/
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location "$SITE_URL" -o /tmp/yeti-live-index.html 2>/dev/null \
              && grep -q 'flight-trial-sop-editor.js?v=21' /tmp/yeti-live-index.html \
              && grep -q 'flight-trial-sop-reader.css?v=2' /tmp/yeti-live-index.html; then
              ready=true
              break
            fi
            echo "Waiting for GitHub Pages deployment ($attempt/24)…"
            sleep 5
          done
          test "$ready" = true
          curl --fail --silent --show-error --location "${SITE_URL}js/flight-trial-sop-editor.js?v=21" -o /tmp/yeti-sop-editor.js
          curl --fail --silent --show-error --location "${SITE_URL}css/flight-trial-sop-reader.css?v=1" -o /tmp/yeti-sop-reader.css
          curl --fail --silent --show-error --location "${SITE_URL}service-worker.js" -o /tmp/yeti-service-worker.js
          grep -q 'PDFJS_MODULE' /tmp/yeti-sop-editor.js
          grep -q 'pdfjs.getDocument' /tmp/yeti-sop-editor.js
          grep -q 'yeti-sop-pdf-canvas' /tmp/yeti-sop-reader.css
          grep -q 'yeti-flight-trial-shell-v226' /tmp/yeti-service-worker.js
          grep -q 'pdfjs-dist@4.10.38' /tmp/yeti-service-worker.js
          echo "Stage 3 PASS — the standard GitHub Pages deployment is live and serves the PDF.js SOP reader, stylesheet and pinned runtime cache."
          echo "- Live URL: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"

# SOP JSON upload validation workflow revision.

