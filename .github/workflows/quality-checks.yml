name: YETI Six-Layer Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeti-six-layer-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  six-layer-quality:
    name: Six layers — one quality check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the unchanged production UI baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: .baseline-main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore pinned test dependencies and browser binaries
        id: quality-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-yeti-six-layer-node22-pw1.65.1-pixelmatch5.3.0-png6.0.0-axe4.11.0-v1

      - name: Install pinned test dependencies
        run: npm install --no-save --no-package-lock playwright@1.65.1 pixelmatch@5.3.0 pngjs@6.0.0 axe-core@4.11.0

      - name: Install browser engines on a cold cache
        if: steps.quality-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit

      - name: Run all six quality layers with a strict execution budget
        env:
          YETI_BASELINE_ROOT: ${{ github.workspace }}/.baseline-main
        run: node scripts/run-six-layer-quality.mjs
