name: YETI 2-Minute Quick Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeti-quick-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-quality-check:
    name: Quick Quality Check — single job
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the only quality check
        shell: bash
        run: |
          set -euo pipefail
          echo "## YETI 2-Minute Quick Quality Check" >> "$GITHUB_STEP_SUMMARY"
          run_check() {
            label="$1"
            shift
            started=$(date +%s)
            echo "::group::$label"
            "$@"
            elapsed=$(( $(date +%s) - started ))
            echo "PASS — $label (${elapsed}s)"
            echo "- PASS — $label (${elapsed}s)" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          }
          run_check "Application structure, assets and JavaScript syntax" node scripts/validate-app.mjs
          run_check "Propulsion calculation unit tests" node tests/propulsion-analysis-engine.test.js
          run_check "Analyzer module regression tests" node tests/yeti-modules.test.js
          echo "OVERALL: PASS — all quick checks completed." >> "$GITHUB_STEP_SUMMARY"
          echo "YETI QUICK QUALITY CHECK PASSED."

  deploy-production:
    name: Deploy to GitHub Pages
    needs: quick-quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the quality-checked commit
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package YETI application
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
