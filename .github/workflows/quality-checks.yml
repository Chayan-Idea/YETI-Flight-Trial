name: YETI Quick Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeti-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-quality-gate:
    name: Quick Quality Gate — target under 2 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Node and Chromium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            node_modules
          key: yeti-quick-v1-${{ runner.os }}-node22-playwright1.65.1
          restore-keys: |
            yeti-quick-v1-${{ runner.os }}-node22-playwright1.65.1-

      - name: Install only missing pinned test dependencies
        run: |
          if [ ! -x node_modules/.bin/playwright ]; then
            npm install --no-save --no-package-lock playwright@1.65.1
          fi

      - name: Validate application structure, assets and syntax
        run: node scripts/validate-app.mjs

      - name: Run propulsion calculation unit tests
        run: |
          node tests/propulsion-analysis-engine.test.js
          node tests/yeti-modules.test.js

      - name: Install Chromium only when cache is cold
        run: |
          if [ ! -d "$HOME/.cache/ms-playwright" ] || ! find "$HOME/.cache/ms-playwright" -maxdepth 1 -type d -name 'chromium-*' | grep -q .; then
            ./node_modules/.bin/playwright install chromium
          fi

      - name: Run core application browser smoke
        run: node tests/browser-smoke.cjs

      - name: Run critical Flight Preparation operational smoke
        run: node tests/flight-preparation.e2e.cjs

      - name: Run analyzer and comparative PDF export regression
        run: node tests/propulsion-analyser.e2e.cjs

      - name: Upload quick-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yeti-quick-gate-failure
          path: |
            /tmp/yeti-browser-failure.png
            /tmp/yeti-browser-trace.zip
          if-no-files-found: ignore
          retention-days: 7
