name: YETI PDF Template Candidate Analysis

on:
  push:
    paths:
      - 'template-inbox/**/*.pdf'
      - 'template-inbox/*.pdf'
  workflow_dispatch:
    inputs:
      pdf_path:
        description: Repository path of one PDF inside template-inbox/
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yeti-pdf-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-template:
    name: Extract review-only PDF candidates
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF analysis dependency
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Analyse every new PDF safely
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PDF_PATH: ${{ inputs.pdf_path }}
        run: |
          set -euo pipefail
          mkdir -p template-candidates
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            paths=("$INPUT_PDF_PATH")
          else
            mapfile -t paths < <(git diff-tree --no-commit-id --name-only --diff-filter=AM -r HEAD -- 'template-inbox/*.pdf' 'template-inbox/**/*.pdf')
          fi
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No new or modified PDFs found in template-inbox/."
            exit 1
          fi
          for pdf_path in "${paths[@]}"; do
            case "$pdf_path" in
              template-inbox/*.pdf|template-inbox/**/*.pdf) ;;
              *) echo "Rejected path outside template-inbox/: $pdf_path"; exit 1 ;;
            esac
            test -f "$pdf_path"
            name="$(basename "$pdf_path" .pdf)"
            safe_name="$(printf '%s' "$name" | tr -cs 'A-Za-z0-9._-' '_')"
            python scripts/analyze-pdf-template.py "$pdf_path" --output "template-candidates/${safe_name}-candidate.json"
            python scripts/build-pdf-review-package.py "template-candidates/${safe_name}-candidate.json" "$pdf_path" --template-id "$safe_name" --version "1.0.0" --output "template-candidates/${safe_name}-package.candidate.json"
          done
      - name: Upload review candidates
        uses: actions/upload-artifact@v4
        with:
          name: yeti-pdf-template-candidates
          path: template-candidates/*.json
          if-no-files-found: error
